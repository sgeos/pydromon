# Proposes updates to the pinned actions. Each proposal is a pull request that CI
# checks and the operator reviews. The cooldown keeps a release out until it has had
# a week to be noticed if it is bad. Python dependencies are pinned exactly by
# decision, so they are updated by hand. Grouping puts every action update of one week
# into a single pull request, which keeps review and CI load to one run a week.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
