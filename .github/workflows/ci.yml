# Continuous integration, roadmap task 10.
#
# Each job runs the local gate, scripts/check.sh, so a green run here means what a
# green run on a developer machine means. Live tests are not run, because they need
# the operator's subscriptions, and no credential of any kind is given to CI.
#
# Supply chain. Actions are pinned to full commit hashes with the release tag in a
# comment, so a moved or compromised tag cannot change what runs. The pins are
# releases already in use by the pykeleusma repository, and Dependabot proposes
# newer ones after a cooldown. The workflow only reads the repository, and the
# workflows job lints this file with actionlint and zizmor, as sgeos/project-template
# does.
#
# Account load. GitHub-hosted runners share one concurrent-job limit across the whole
# sgeos account, and macOS runners a smaller one, so the matrix runs two jobs at a
# time. paths-ignore is not used, because a pull request with no checks would stall the
# merge procedure, which waits on them.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# No permissions by default. Each job grants only what it needs.
permissions: {}

# Supersede an in-flight run when a pull request is pushed again, and leave branch runs
# alone. The group is the ref for a pull request and the unique run identifier
# otherwise, so that a second merge to main cannot cancel the first merge's run and
# leave a commit on main with no result of its own. This follows the Keleusma
# repository's reasoning in its own ci.yml, by way of sgeos/project-template.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    # pykeleusma must install from a published wheel. Ubuntu runners ship Rust, so
    # without this a wheel that stopped matching would build from source silently.
    env:
      UV_NO_BUILD_PACKAGE: pykeleusma
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-latest, macos-latest]
        # 3.12 is requires-python in pyproject.toml, and 3.15 the newest release.
        python: ["3.12", "3.15"]
    steps:
      # The full history, so that origin/main exists. The gate's changelog rule compares
      # a branch with its merge base with origin/main, and at the default depth of one
      # there is no such reference, so the rule would be skipped on every job. On a push
      # to main the merge base is the commit itself and the rule finds nothing to refuse.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      # pykeleusma installs from its published wheels, so no Rust toolchain is needed.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      # The gate fails without shellcheck, so that a green run never means "not
      # checked". Ubuntu runners include it, and macOS runners may not.
      - name: Install shellcheck where it is missing
        if: runner.os == 'macOS'
        run: command -v shellcheck >/dev/null || brew install shellcheck

      # Socket tests run here, since runners allow Unix domain sockets. UV_PYTHON makes
      # the gate's locked sync install for this job's interpreter.
      - name: The local gate
        env:
          UV_PYTHON: ${{ steps.python.outputs.python-path }}
        run: ./scripts/check.sh

  # Lints the workflows themselves. actionlint checks syntax, expressions and the
  # shell in run steps, and zizmor checks for known security weaknesses, such as
  # injection through untrusted input, excessive permissions and unpinned actions. Both
  # run here only. The actionlint image is pinned by digest, and zizmor's version is
  # pinned explicitly, as in sgeos/project-template.
  workflows:
    name: workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: >-
          docker run --rm --volume "$PWD:/repo" --workdir /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -color
      - name: zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: 1.31.1
          advanced-security: false
