# Continuous integration, roadmap task 10.
#
# Each job runs the local gate that CLAUDE.md lists, so a green run here means what a
# green run on a developer machine means. Live tests are not run, because they need
# the operator's Claude subscription, and no credential of any kind is given to CI.
#
# Supply chain. Actions are pinned to full commit hashes with the release tag in a
# comment, so a moved or compromised tag cannot change what runs. The pins are
# releases already in use by the pykeleusma repository, and Dependabot proposes
# newer ones after a cooldown. The workflow only reads the repository.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # 3.12 is requires-python in pyproject.toml, and 3.15 the newest release.
        python: ["3.12", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      # The cache keeps the pykeleusma wheel, which otherwise builds from source.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      # pykeleusma is a git dependency with a Rust extension, so it needs cargo.
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install the package and tools
        run: uv sync --locked --python "${{ steps.python.outputs.python-path }}"

      - name: Ruff
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .

      - name: Pyright
        run: uv run --no-sync pyright

      # Socket tests run here, since runners allow Unix domain sockets. Warnings are
      # errors, as in the local gate.
      - name: Tests
        run: uv run --no-sync pytest -W error
