[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[project]
# The distribution follows the py-prefix convention of pykeleusma. The import
# package is plain `dromon`. The bare name `dromon` is reserved for the lasting
# Keleusma implementation, which is not a Python package, so nothing collides.
name = "pydromon"
version = "0.0.0"
description = "Python prototype of Dromon, a multi-agent harness daemon"
readme = "README.md"
license = "0BSD"
license-files = ["LICENSE"]
authors = [{ name = "Brendan Sechter", email = "sgeos@hotmail.com" }]
requires-python = ">=3.12"
# Both are pinned exactly. The Agent SDK bundles the Claude Code binary, so its version
# fixes the engine's behaviour. pykeleusma's version names the Keleusma release it
# binds, 0.2.2, and its own release against it. Its wheels need no Rust toolchain, and
# only a platform without a wheel builds it from source with one.
dependencies = [
    "claude-agent-sdk==0.2.174",
    "cryptography==50.0.2",
    "pykeleusma==0.2.2.0",
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]

[project.scripts]
# The command names are shared by every implementation of Dromon, so scripts and
# habits carry across the Python, Rust and Keleusma versions.
dromond = "dromon.daemon:main"
dromon = "dromon.cli:main"
# The watcher each harness runs under, which the Agent SDK starts in place of Claude
# Code. It is not for an operator to run, see dromon.launcher.
dromon-launch = "dromon.launcher:main"

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.17.2", "pyright==1.1.414"]

[tool.uv.build-backend]
module-name = "dromon"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Socket tests bind Unix domain sockets, which Claude Code's sandbox denies. They run by
# default. Deselect them with -m "not socket" only to run the rest inside a sandbox.
# Live tests use the operator's Claude subscription. They run only when selected with
# -m live and enabled with DROMON_LIVE_TESTS=1, since a later -m replaces addopts.
markers = [
    "socket: binds a Unix domain socket",
    "live: calls the real engine on the operator's subscription",
]
# Collection skips the state directory, which a line's sandbox denies outright, so a
# line running the gate in its own project would otherwise fail to collect.
addopts = "-m 'not live' --ignore=.dromon"
# A test that runs for five minutes is taken as hung. pytest then prints the traceback
# of every thread and exits, so a hang names its test rather than running out the job's
# timeout in silence, as one macOS job did on 2026-10-28. The slowest test took 89
# seconds on the operator's host on 2026-10-29, while two lines worked beside it, so
# the bound leaves a margin for a slow runner. It uses the standard library's
# faulthandler and adds no dependency.
faulthandler_timeout = 300
faulthandler_exit_on_timeout = true

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "B", "S", "ANN", "RET", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Assertions are how pytest states expectations.
"tests/*" = ["S101"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
